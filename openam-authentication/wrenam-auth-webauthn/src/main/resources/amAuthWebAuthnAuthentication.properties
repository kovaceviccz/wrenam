iPlanetAMAuthWebAuthnAuthenticationServiceDescription=WebAuthn Authentication
usernameless=Discoverable Credential Login
usernameless.help=Allow passkey authentication without prompting for username by resolving the account from a discoverable credential user handle.
userVerification=User Verification
userVerification.help=Requirement for user verification during authentication.
rpId=Relying Party ID
rpId.help=ID of the relying party.
origin=Origin
origin.help=Origin of the relying party.
timeout=Authentication Timeout (ms)
timeout.help=The period of time (hint, in milliseconds) within which authentication should complete.
authenticationLevel=Authentication Level
authenticationLevel.help=The authentication level associated with this module.
authenticatorError=Your device reported a problem. Try again, or use another way to sign in.
failedPreparingScriptCallback=Could not prepare the client script for WebAuthn.
failureReason.USER_CANCELLED=Passkey sign-in was cancelled. Try again or use another method.
failureReason.UNSUPPORTED=This browser or device does not support passkeys here. Use another sign-in method.
failureReason.NO_AUTHENTICATOR=No passkey is available on this device. Try another device or use another sign-in method.
failureReason.NOT_ALLOWED=The passkey prompt timed out or was not allowed. Try again or use another sign-in method.
failureReason.CREDENTIAL_NOT_FOUND=The selected passkey is not recognized for this account. Try another passkey or use another sign-in method.
failureReason.NO_REGISTERED_CREDENTIALS=No passkey is registered for this account. Sign in another way and create a passkey from your profile.
failureReason.CHALLENGE_EXPIRED=This passkey request expired. Start again and retry.
failureReason.ORIGIN_MISMATCH=Passkey request origin is not trusted. Verify the login URL and contact your administrator.
failureReason.RP_ID_MISMATCH=Passkey request domain validation failed. Verify the login URL and contact your administrator.
failureReason.VERIFICATION_FAILED=Passkey sign-in did not finish. Try again or use another sign-in method.
