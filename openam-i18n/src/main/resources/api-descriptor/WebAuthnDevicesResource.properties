title=WebAuthn User Devices
description=The WebAuthn Devices service provides operations for managing a user's WebAuthn authentication devices. \
  Supported methods include querying, updating, deleting, recovery-code regeneration, and browser credential sync.
pathparams.user=The identifier of the user associated with the request.
pathparam.description=The unique identifier of the user's WebAuthn authentication device
delete.description=Delete a WebAuthn user device
update.description=Update an existing WebAuthn user device
action.regenerateRecoveryCodes.description=Invalidate the existing recovery codes for this device, generate a \
  fresh set, and return the new codes in plaintext exactly once in the action response. Subsequent reads of a \
  sealed device disclose only the remaining count.
action.signalAllAcceptedCredentials.description=Prepare a WebAuthn signalAllAcceptedCredentials payload for the \
  browser when a complete single-RP credential list is available.
error.unexpected.server.error.description=An unexpected server error occurred while processing the request
query.description=Retrieve the user's device profiles
schema.title=WebAuthn user devices schema
schema.description=Schema for WebAuthn user device metadata returned by this resource.
schema.uuid.title=Device id
schema.uuid.description=Device unique identifier
schema.deviceName.title=Device name
schema.deviceName.description=User-visible name of the registered WebAuthn authenticator
schema.type.title=Device type
schema.type.description=Static type marker for WebAuthn devices
schema.transports.title=Authenticator transports
schema.transports.description=Transports reported at registration time, if available
schema.createdAt.title=Created at
schema.createdAt.description=Server time at which the WebAuthn credential was registered
schema.recoveryCodes.title=Recovery codes
schema.recoveryCodes.description=Remaining one-time recovery codes for this WebAuthn credential. Only present \
  while the device is unsealed; sealed devices never disclose the plaintext values.
schema.recoveryCodesSealed.title=Recovery codes sealed
schema.recoveryCodesSealed.description=Whether the recovery codes have been revealed once and are no longer \
  returned in plaintext
schema.recoveryCodesRemaining.title=Recovery codes remaining
schema.recoveryCodesRemaining.description=Number of unused recovery codes still available for this device
action.signalAllAcceptedCredentials.response.schema.title=Accepted WebAuthn credentials signal schema
action.signalAllAcceptedCredentials.response.schema.description=Schema for the browser payload used with \
  PublicKeyCredential.signalAllAcceptedCredentials.
action.signalAllAcceptedCredentials.response.schema.signalAvailable.title=Signal available
action.signalAllAcceptedCredentials.response.schema.signalAvailable.description=Whether the response contains a \
  complete signalAllAcceptedCredentials payload.
action.signalAllAcceptedCredentials.response.schema.rpId.title=Relying party ID
action.signalAllAcceptedCredentials.response.schema.rpId.description=Relying party ID for the accepted credential \
  list.
action.signalAllAcceptedCredentials.response.schema.userId.title=User handle
action.signalAllAcceptedCredentials.response.schema.userId.description=Base64url-encoded WebAuthn user handle for \
  the accepted credential list.
action.signalAllAcceptedCredentials.response.schema.allAcceptedCredentialIds.title=Accepted credential IDs
action.signalAllAcceptedCredentials.response.schema.allAcceptedCredentialIds.description=Base64url-encoded \
  credential IDs accepted by the server for this relying party and user handle.
